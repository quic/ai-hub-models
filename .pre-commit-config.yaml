exclude: |
    (?x)(
        /build/|
        src/qai_hub_models/models/templates/lm_driver/|
        src/qai_hub_models/models/templates/lm_schema/
    )

repos:
-   repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
     -  id: insert-license
        files: \.py|\.sh$
        exclude: >
            (?x)^(
            src/qai_hub_models/extern/basicsr/|
            src/qai_hub_models/extern/xtcocotools/
            )
        args:
            - --license-filepath
            - .pre-commit-license-header.txt
            - --allow-past-years
            - --no-extra-eol
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^scripts/ci/
    -   id: trailing-whitespace
        exclude: '\.diff$'
        args: [--markdown-linebreak-ext=md]
    -   id: check-added-large-files
        args: ['--maxkb=1024']
    -   id: check-merge-conflict
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
    -   id: end-of-file-fixer
        exclude: |
            (?x)(
                \.diff$
            )
    -   id: fix-byte-order-marker
-   repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
    -   id: actionlint
# SC2028: Use printf instead of echo
# SC2129: Consider using { cmd1; cmd2; } >> file instead of individual redirects.
        args: ['-ignore', 'SC2028', '-ignore', 'SC2129']
-   repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
    -   id: shellcheck
        exclude: '\.yml$'
        args: ['--severity=warning']
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
    -   id: ruff-check
        name: Ruff check (src)
        args: [--fix, --config=src/ruff.toml]
        files: ^src/
    -   id: ruff-check
        name: Ruff check (cli)
        args: [--fix, --config=cli/ruff.toml]
        files: ^cli/
    -   id: ruff-check
        name: Ruff check (scripts)
        args: [--fix]
        files: ^scripts/
    -   id: ruff-format
        name: Ruff format (src)
        args: [--config=src/ruff.toml]
        files: ^src/
    -   id: ruff-format
        name: Ruff format (cli)
        args: [--config=cli/ruff.toml]
        files: ^cli/
    -   id: ruff-format
        name: Ruff format (scripts)
        files: ^scripts/
-   repo: https://github.com/jsh9/pydoclint
    rev: 0.7.3
    hooks:
    -   id: pydoclint
        name: pydoclint (src)
        args: [--quiet, --config=src/pyproject.toml]
        files: ^src/
    -   id: pydoclint
        name: pydoclint (cli)
        args: [--quiet, --config=cli/pyproject.toml]
        files: ^cli/
-   repo: local
    hooks:
    -   id: mypy-src
        name: mypy (src)
        files: ^src/qai_hub_models/.*(py|pyi|ipynb)$
        entry: python scripts/util/run_mypy.py src
        language: system
        # By default, precommit will split the files into groups and run
        # mypy on each group in parallel. This causes mypy to miss issues
        # and/or dump the failure several times.
        #
        # This flag makes precommit run mypy once on all files.
        require_serial: true
    -   id: mypy-cli
        name: mypy (cli)
        files: ^cli/qai_hub_models_cli/.*(py|pyi|ipynb)$
        entry: python scripts/util/run_mypy.py cli
        language: system
        require_serial: true
