technical_details:
  Model architecture: Multimodal Transformer with InternViT Vision Encoder, Qwen-based Large Language Model (LLM) backend, Grouped Query Attention (GQA), and SwiGLU activation. It follows a ViT → MLP → LLM design for efficient vision-language understanding and reasoning.
  Response Rate: Rate of response generation after the first response token.
  Supported languages: No exact mention
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt.
