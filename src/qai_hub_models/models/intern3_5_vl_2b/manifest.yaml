- Phone
- Tablet
- IoT
has_animated_banner: true
has_multi_graph: true
has_static_banner: true
headline: Multimodal 2B vision-language model for text and image understanding.
id: intern3_5_vl_2b
is_aimet: true
is_collection_model: true
license: https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md
