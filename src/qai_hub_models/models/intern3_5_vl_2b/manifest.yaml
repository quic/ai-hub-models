        num_iterations: 2048
      - dataset:
          name: Interleaved
          source_datasets:
          - name: AOKVQA
            split: train
          - name: Wikitext
            split: train
        name: Calibration
        num_iterations: 20
      visual:
      - enable_r1: true
        enable_r3: true
        name: SpinQuant
      - dataset:
          name: AOKVQA
          split: train
        name: Calibration
        num_iterations: 64
